# Canonical schema for workflows in BMDex

name: "<workflow_name>"

type: "<workflow_type>"

status: "<validated|experimental|deprecated>"

description: >
  Short workflow description.

methods:
  - "<method>"

software:
  - "<software_package>"

inputs:
  - "<input_file>"

outputs:
  - "<output_file>"

cluster:
  partition: "<partition_name>"
  account: "<account_name>"

validation:
  - "<validation_check>"

dependencies:
  - "<dependency>"

maintainers:
  - "<maintainer>"

related_tools:
  - "<tool_name>"

notes: >
  Optional workflow notes.
