# Canonical schema for reusable computational tools in BMDex

name: "<tool_name>"

category:
  - "<category>"

status: "<validated|experimental|deprecated>"

description: >
  Short description of the tool.

scientific_domains:
  - "<domain>"

dependencies:
  - "<dependency>"

inputs:
  - "<input_type>"

outputs:
  - "<output_type>"

maintainers:
  - "<maintainer>"

origin:
  repository: "<original_repository>"
  publication:
    title: "<publication_title>"
    doi: "<doi>"

uses:
  - "<related_workflow>"
  - "<related_method>"

notes: >
  Optional implementation or operational notes.
