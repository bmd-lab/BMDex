# Canonical schema for curated datasets in BMDex

name: "<dataset_name>"

type: "<dataset_type>"

status: "<validated|experimental|deprecated>"

description: >
  Short dataset description.

scientific_context: >
  Scientific motivation and intended usage.

origin:
  repository: "<original_repository>"
  publication:
    title: "<publication_title>"
    doi: "<doi>"

format: "<yaml|json|csv|other>"

maintainers:
  - "<maintainer>"

validation:
  - "<validation_method>"

limitations:
  - "<limitation>"

notes: >
  Optional dataset notes.
