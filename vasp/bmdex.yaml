schema_version: 1
id: hpc.vasp.resources
type: hpc
status: validated
validation_level: documented
title: VASP Resources
domain:
  - hpc
  - vasp
  - slurm
description: >
  Lab-wide VASP standards, execution guidance, input templates, POTCAR policy,
  and runnable VASP examples for BMD Lab workflows.
files:
  documentation:
    - README.md
    - input-standards.md
    - vasp-execution.md
    - gpu-vasp.md
    - potcar-setup.md
  scripts:
    - make_potcar_from_spec.py
    - create_mp_relax_inputs.py
  templates:
    - templates/INCAR.relax
    - templates/INCAR.static
    - templates/KPOINTS.example
    - templates/POTCAR.spec.example
  examples:
    - examples/si_bulk_relax/
dependencies:
  - pymatgen
  - mp-api
related:
  hpc:
    - hpc.slurm.operational_standards
    - hpc.vasp.potcar_setup
  methods:
    - method.vasp.input_standards
  templates:
    - template.vasp.incar_relax
    - template.vasp.incar_static
    - template.vasp.kpoints_example
    - template.vasp.potcar_spec
    - template.slurm.submit_vasp
  examples:
    - example.vasp.si_bulk_relax
validation:
  - VASP templates and example sidecars validate with repository metadata tooling.
  - Python utility scripts compile successfully.
  - Documents current BMD Lab VASP execution and POTCAR conventions.
limitations:
  - VASP settings are starting points and require workflow-specific convergence checks.
  - Cluster modules and POTCAR paths require periodic revalidation.
  - Running make_potcar_from_spec.py requires licensed local POTCAR access through pymatgen.
  - Running create_mp_relax_inputs.py requires a Materials Project API key and mp-api.
maintainers:
  - bmd-lab
