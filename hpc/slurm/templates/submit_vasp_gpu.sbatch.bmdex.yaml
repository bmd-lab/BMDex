status: experimental
validation_level: documented
title: SLURM Submission Template for GPU VASP
domain:
  - slurm
  - hpc
  - vasp
  - gpu
description: >
  Reference SLURM submission script for GPU VASP calculations on TAU
  PowerSLURM.
files:
  template: submit_vasp_gpu.sbatch
  documentation: submit_vasp_gpu.sbatch.md
related:
  hpc:
    - hpc.slurm.operational_standards
