schema_version: 1
id: hpc.slurm.operational_standards
type: hpc
status: validated
validation_level: documented
title: TAU PowerSLURM Operational Standards
domain:
  - hpc
  - slurm
  - python
description: >
  Cluster-specific SLURM, Python, and high-throughput operational standards for
  BMD Lab workflows on TAU PowerSLURM.
files:
  documentation:
    - README.md
    - cluster-profile.md
    - slurm-standards.md
    - python-environments.md
    - high-throughput.md
    - common_failures.md
  scripts:
    - submit_many_vasp.py
    - vasp_status.py
    - restart_relaxations.py
    - check_power_environment.sh
  templates:
    - templates/submit_vasp.sbatch
    - templates/submit_vasp_gpu.sbatch
    - templates/submit_python.sbatch
related:
  hpc:
    - hpc.vasp.resources
  templates:
    - template.slurm.submit_vasp
    - template.slurm.submit_python
    - template.slurm.submit_vasp_gpu
validation:
  - Python operational scripts compile successfully.
  - Shell utility syntax is checked with bash -n.
  - Distilled from existing BMD Lab tutorial workflows and cluster usage notes.
  - Documents current partition, account, module, and filesystem conventions.
limitations:
  - Cluster policies, modules, and filesystem paths can change and require periodic revalidation.
  - Resource tiers are starting points and do not replace workflow-specific benchmarking.
  - Scripts provide operational triage and do not replace scientific convergence review.
  - Queue behavior and completion markers may need cluster-specific adjustment.
maintainers:
  - bmd-lab
