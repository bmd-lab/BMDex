schema_version: 1
id: tool.electroneutrality.matching
type: tool
information_class: asset
visibility: private
stewardship: bmd-lab
status: experimental
validation_level: example_only
title: Electroneutrality Matching Tools
domain:
  - electroneutrality
  - composition_generation
  - materials_discovery
description: >
  Runnable utilities for generating charge-balanced candidate compositions from
  oxidation-state assignments.
files:
  scripts:
    - generate_binary_oxides.py
    - generate_ternaries.py
  helpers:
    - _datasets.py
  documentation:
    - README.md
    - ORIGIN.md
dependencies:
  - python
  - pyyaml
inputs:
  - oxidation_state_dataset
outputs:
  - candidate_formulas
uses:
  datasets:
    - dataset.element_charges.representative_84
related:
  methods: []
  workflows: []
provenance:
  origin_file: ORIGIN.md
  source_repository: https://github.com/bmd-lab/electroneutral_match
  publication:
    title: Data-Mining Element Charges in Inorganic Materials
    doi: 10.1021/acs.jpclett.0c02072
validation:
  - Scripts generate binary and ternary oxide candidate formulas.
limitations:
  - Electroneutrality is necessary but insufficient for chemical realizability.
  - Current utilities are lightweight scripts, not a full validated screening workflow.
  - Generated formulas require downstream scientific validation.
maintainers:
  - bmd-lab
notes: >
  The oxidation-state data is canonical in
  datasets/element_charges/. Tool prose should reference that dataset rather
  than duplicate dataset provenance.
