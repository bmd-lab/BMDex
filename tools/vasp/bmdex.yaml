schema_version: 1
id: tool.vasp.input_utilities
type: tool
status: experimental
validation_level: example_only
title: VASP Input Utilities
domain:
  - vasp
  - pymatgen
  - input_generation
description: >
  Practical pymatgen-native utilities for generating VASP POTCAR files from
  POTCAR.spec and creating Materials Project relaxation input folders.
files:
  scripts:
    - make_potcar_from_spec.py
    - create_mp_relax_inputs.py
  documentation:
    - README.md
dependencies:
  - pymatgen
  - mp-api
related:
  hpc:
    - hpc.tau_powerslurm.potcar_setup
  methods:
    - method.vasp.input_standards
validation:
  - Python scripts compile successfully.
  - Scripts preserve the BMDex policy of storing POTCAR.spec instead of POTCAR content.
limitations:
  - Running make_potcar_from_spec.py requires licensed local POTCAR access through pymatgen.
  - Running create_mp_relax_inputs.py requires a Materials Project API key and mp-api.
maintainers:
  - bmd-lab
