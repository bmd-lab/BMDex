schema_version: 1
id: tool.structure_prototypes.utilities
type: tool
information_class: asset
visibility: private
stewardship: bmd-lab
status: experimental
validation_level: script_compile
title: Structure Prototype Utilities
domain:
  - structure_prototypes
  - structure_analysis
  - materials_project
  - pymatgen
description: >
  Practical utilities for abundance-aware ranking, framework comparison, and
  summary generation for the BMDex structure prototype dataset.
files:
  scripts:
    - abundance_rank.py
    - get_abundant_prototypes.py
    - generate_frameworks_list.py
  documentation:
    - README.md
dependencies:
  - pymatgen
  - pyyaml
optional_dependencies:
  - pandas
uses:
  datasets:
    - dataset.structure_prototypes.mp_unique_frameworks_2025
    - dataset.element_abundances.crustal_abundance
outputs:
  - sorted-structures/*/unique_structures.txt
validation:
  - Python scripts compile successfully.
  - Default abundance-data path points to the canonical BMDex abundance dataset.
limitations:
  - Framework matching tolerances are workflow-dependent.
  - Summary generation writes output files into the processed prototype folders.
  - Materials Project-derived prototype data require license and redistribution review before broader reuse.
maintainers:
  - bmd-lab
notes: >
  These utilities were separated from the structure prototype dataset so the
  dataset remains scientific data and the reusable operations remain under
  tools.
