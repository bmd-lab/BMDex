schema_version: 1
id: tool.structure_transform.utilities
type: tool
status: experimental
validation_level: example_only
title: Structure Transform Utilities
domain:
  - structure_manipulation
  - structure_analysis
  - vasp
  - pymatgen
description: >
  Practical runnable utilities for transforming, cleaning, generating, and
  comparing crystal structures in VASP- and pymatgen-oriented workflows.
files:
  scripts:
    - generate_all_slabs.py
    - make_supercell.py
    - make_primitive.py
    - sort_poscar_by_species.py
    - compare_frameworks.py
  helpers:
    - slab_generator.py
    - supercell_builder.py
    - orientation_utils.py
  documentation:
    - README.md
dependencies:
  - pymatgen
inputs:
  - POSCAR
  - CONTCAR
  - CIF
outputs:
  - generated_slabs/POSCAR_*.vasp
  - POSCAR_supercell.vasp
  - POSCAR_primitive.vasp
  - POSCAR_sorted.vasp
  - terminal reports
validation:
  - Python scripts compile successfully.
  - Scripts are documented as direct researcher-facing utilities.
limitations:
  - Generated structures require scientific review before production calculations.
  - Symmetry, slab, and framework matching tolerances are workflow-dependent.
  - Oxidation-state settings and supercell matrices must be edited for each use case.
maintainers:
  - bmd-lab
notes: >
  This directory intentionally groups common structure transformations together
  so researchers can find useful scripts quickly without navigating
  ontology-driven subdirectories.
