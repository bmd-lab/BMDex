schema_version: 1
id: tool.structure.mss_auto
type: tool
status: experimental
validation_level: example_only
title: MSS-Auto Structure Screening Tooling
domain:
  - structure_analysis
  - slab_generation
  - layered_materials
  - materials_screening
description: >
  Structure-focused screening workflow tooling for layered-material analysis,
  slab generation, crystallographic orientation handling, and reusable
  structure-preparation workflows.
files:
  documentation:
    - README.md
    - ORIGIN.md
  workflow_notes:
    - workflows/layered_material_screening.md
  examples:
    - examples/generate_mos2_screening.py
  validation_notes:
    - validation/README.md
dependencies:
  - pymatgen
  - numpy
inputs:
  - POSCAR
  - CIF
  - crystallographic_structure
outputs:
  - slab_structures
  - orientation_metadata
  - screening_summaries
origin:
  repository: https://github.com/bmd-lab/mss_auto
  publication:
    title: Predicting two-dimensional semiconductors using conductivity effective mass
    journal: Phys. Chem. Chem. Phys.
    year: 2024
uses:
  local_tools:
    - tools/structure/slabs/
    - tools/structure/supercells/
    - tools/structure/orientations/
validation:
  - Example MoS2 screening script demonstrates loading a structure and generating a slab.
  - Validation notes define expected checks for generated structures and vacuum spacing.
limitations:
  - Screening outputs do not guarantee thermodynamic exfoliation feasibility.
  - Current validation is example-level, not a fully automated test suite.
  - Example script expects an input POSCAR in the working directory.
maintainers:
  - bmd-lab
notes: >
  MSS-Auto is kept under tools/structure because its reusable content is
  structure analysis, orientation handling, and slab workflow tooling.
