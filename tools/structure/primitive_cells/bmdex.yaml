schema_version: 1
id: tool.structure.primitive_cells
type: tool
status: experimental
validation_level: example_only
title: Structure Primitive-Cell Utilities
domain:
  - structure_manipulation
  - primitive_cells
  - vasp
description: >
  Practical pymatgen-native utilities for reducing VASP structures to primitive
  cells.
files:
  scripts:
    - make_primitive_cell.py
  documentation:
    - README.md
dependencies:
  - pymatgen
inputs:
  - POSCAR
  - CONTCAR
outputs:
  - POSCAR_primitive.vasp
validation:
  - Scripts compile successfully with Python.
  - Script behavior is documented in README.md.
limitations:
  - Primitive-cell identification depends on symmetry tolerances.
  - Relaxed distorted structures may require manual tolerance adjustment or scientific review.
maintainers:
  - bmd-lab
notes: >
  The researcher-facing interface is the standalone make_primitive_cell.py
  script.
