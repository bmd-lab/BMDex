id: tool.structure.prototypes.mp_unique_frameworks_2025
type: tool_data
status: experimental
validation_level: external_source_import
title: Materials Project Unique Structure Prototypes 2025
domain:
  - structure_prototypes
  - pymatgen
  - materials_project
description: >
  Materials Project-derived CIF prototype collection grouped by anonymous
  stoichiometry labels and summarized by unique framework representatives.
storage:
  external_path: external/structure-prototypes
  data_subdir: sorted-structures
files:
  summaries:
    - all-prototypes-unfiltered.txt
    - sorted-structures/*/unique_structures.txt
  structures:
    pattern: sorted-structures/**/*.cif
counts:
  source_materials_analyzed: 23160
  prototype_groups: 174
  cif_files: 5557
  filtered_unique_entries: 699
  unfiltered_entries: 2410
origin:
  repository: https://github.com/bmd-lab/structure-prototypes.git
  commit: 3072b2e7b5dab54ed7a434d453838d8ce864d61a
  thesis:
    title: The Unique Structure Prototypes of All Materials
    institution: Tel Aviv University
    year: 2025
  source_database: Materials Project
method_summary:
  - Structures were grouped by anonymous stoichiometry labels.
  - Unique frameworks were identified from atomic geometries using pymatgen structure matching.
  - Prototype summaries record representative CIF filename, formula, match count, space group, lattice matrix, and fractional coordinates.
dependencies:
  - pymatgen
limitations:
  - Raw data remains in external/structure-prototypes and is not duplicated here.
  - License and redistribution terms need explicit documentation before broader reuse.
  - Derived from Materials Project structures and associated database assumptions.
  - External source worktree may contain untracked local workflow files not covered by this metadata record.
planned_integrations:
  reusable_tools:
    - tool.structure.prototype_loader
    - tool.structure.framework_matcher
  workflows:
    - workflow.structure_prototypes.identify_unique_frameworks
maintainers:
  - bmd-lab
notes: >
  This sidecar integrates the external source into the structure-tools section
  of BMDex without migrating or duplicating the raw CIF collection.
